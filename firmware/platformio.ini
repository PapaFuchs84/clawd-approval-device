; Target board: classic LilyGO/TTGO T-Display (ESP32-D0WDQ6, non-S3).
; Pin/display values taken 1:1 from BitMaker-hub/NerdMiner_v2:
;   src/drivers/devices/lilygoV1TDisplay.h
;   lib/TFT_eSPI/User_Setups/Setup25_TTGO_T_Display.h
; See docs/HARDWARE.md for how to verify your board matches this profile.

[env:t-display-test]
platform = espressif32@6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv

build_flags =
	; --- TFT_eSPI Konfiguration (statt User_Setup.h, siehe TFT_eSPI-README) ---
	-D USER_SETUP_LOADED=1
	-D ST7789_DRIVER=1
	-D TFT_WIDTH=135
	-D TFT_HEIGHT=240
	-D CGRAM_OFFSET=1
	-D TFT_MOSI=19
	-D TFT_SCLK=18
	-D TFT_CS=5
	-D TFT_DC=16
	-D TFT_RST=23
	-D TFT_BL=4
	-D TFT_BACKLIGHT_ON=HIGH
	-D SPI_FREQUENCY=40000000
	-D SPI_READ_FREQUENCY=6000000
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D LOAD_FONT6=1
	-D LOAD_FONT7=1
	-D LOAD_FONT8=1
	-D LOAD_GFXFF=1
	-D SMOOTH_FONT=1
	; --- Button-Pins (aus lilygoV1TDisplay.h übernommen) ---
	-D PIN_BUTTON_APPROVE=0
	-D PIN_BUTTON_DENY=35

lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	mathertel/OneButton@^2.6.1
	links2004/WebSockets@^2.4.1
	bblanchon/ArduinoJson@^7.1.0
